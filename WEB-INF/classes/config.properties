# ---------------------------------------------------------------------
# Configuración de conexión a base de datos - inmobiliaria_db
# Este archivo NO debe versionarse (ver .gitignore).
# Precedencia: variables de entorno > este archivo > valores por defecto.
#
# Despliegue en Railway (se leen automáticamente desde el entorno):
#   MYSQL_URL / DATABASE_URL  -> URL completa (mysql://usuario:clave@host:puerto/bd)
#   MYSQLHOST                 -> host (por defecto mysql.railway.internal)
#   MYSQLPORT                 -> puerto (por defecto 3306)
#   MYSQLDATABASE             -> base de datos (por defecto railway)
#   MYSQLUSER                 -> usuario (por defecto root)
#   MYSQLPASSWORD             -> contraseña
#
# Pruebas locales (fallback):
#   DB_URL       -> sobrescribe db.url
#   DB_USER      -> sobrescribe db.user
#   DB_PASSWORD  -> sobrescribe db.password
#
# Formato de URL JDBC para MySQL 8:
#   jdbc:mysql://HOST:PUERTO/BD?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# ---------------------------------------------------------------------
db.url=jdbc:mysql://localhost:3306/inmobiliaria_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.user=root
db.password=sergio200606